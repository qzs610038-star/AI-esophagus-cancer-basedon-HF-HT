# ============================================================
# PFMval 服务器配置文件 — AIPatho1@DESKTOP-HKP0IV0 (RTX 4080)
# ============================================================
# 使用方式: 服务器上设置持久化环境变量 PFMVAL_CONFIG 指向此文件
#   setx PFMVAL_CONFIG "D:\AIPatho\qzs\pfmval_deploy_git\configs\config.server.yaml"
#
# 此文件通过稳定 path id 覆盖数据根目录，
# config_utils.py 的 get_patient_paths() 会自动拼接患者子目录。
#
# ⚠️ 数据路径变更时: 只修改 configs/server_paths.yaml 中对应 path id，
#    然后 git commit + push，服务器 pull 后即刻生效。

# ── 服务器 Python 解释器 ──
# 服务器启动器必须调用此绝对路径，禁止使用裸 `python` 或 PATH 查找。
# WindowsApps/python.exe 是 Store 占位别名，会导致 9009；环境迁移只能显式设置 PFMVAL_PYTHON。
runtime:
  python_interpreter: "C:\\Users\\AIPatho1\\pfmval_env\\Scripts\\python.exe"
  require_absolute_path: true
  forbid_path_lookup: true

# ── 训练设备 ──
training:
  device: "auto"

# ── 数据根目录覆盖（机器路径由统一注册表解析）──
path_ids:
  patch_base: phase2_patch_root
  ssgsea_base: phase2_ssgsea_zscore_root

paths:

  # 特征缓存（可选覆盖，不设则用项目相对路径）
  # caches:
  #   uni_tokens: "D:/AIPatho/qzs/data-phase2/caches/uni_tokens"
  #   uni_cls: "D:/AIPatho/qzs/data-phase2/caches/uni_cls"

  # 输出目录（可选覆盖，不设则用项目相对路径 ./checkpoints）
  # outputs:
  #   checkpoints_root: "./checkpoints"

# ── 患者子目录配置（与本地一致，无变更）──
patients:
  HYZ15040:
    patches_subdir: "HYZ15040_noov_split"
    labels_csv: "HYZ15040_ssGSEA_zscore.csv"

  JFX0729:
    patches_subdir: "JFX0729_noov_split"
    labels_csv: "JFX0729_ssGSEA_zscore.csv"

  LMZ12939:
    patches_subdir: "LMZ12939_noov_split"
    labels_csv: "LMZ12939_ssGSEA_zscore.csv"

# ── 交叉验证配置（与本地一致）──
cross_validation:
  folds:
    1: { train: ["JFX0729", "LMZ12939"], test: "HYZ15040" }
    2: { train: ["HYZ15040", "LMZ12939"], test: "JFX0729" }
    3: { train: ["HYZ15040", "JFX0729"], test: "LMZ12939" }

# ── Phase 3 CLAM 基线配置（仅登记，不授权训练）──
# 依据：队友 0801-CLAM README、0721-新划分.pptx，以及用户于 2026-08-03 的明确确认。
phase3_clam:
  status: "configured_not_executed"
  path_ids:
    image_features: server_phase3_escc_uni2h_features
    mpp2_raw_scores: server_phase3_escc_mpp2_raw_scores
    shared_splits: phase3_escc_shared_pcr_mpr_splits
  protocol:
    tasks: ["pCR", "MPR"]
    labels: "use_current_doctor_verified_labels"
    primary_evaluation_unit: "slide"
    secondary_evaluation_unit: "patient"
    input_score_scale: "raw_mpp2_output"
    split_unit: "patient"
    folds: 5
    training_seeds: [1, 2, 42, 61]
    split_dir: "ESCC_shared_pCR_MPR_100"
  evidence_boundary:
    ppt_results_are_historical_reference: true
    training_authorized: false
    result_accepted: false
